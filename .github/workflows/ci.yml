name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasyAuthLocalEmulator.sln

      - name: Build
        run: dotnet build EasyAuthLocalEmulator.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test
          tests/EasyAuthLocalEmulator.UnitTests/EasyAuthLocalEmulator.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Install Playwright browsers
        shell: pwsh
        run: >-
          pwsh
          tests/EasyAuthLocalEmulator.BrowserTests/bin/Release/net10.0/playwright.ps1
          install chromium webkit

      - name: Run Chromium tests
        shell: pwsh
        run: |
          $env:BROWSER = "chromium"
          dotnet test tests/EasyAuthLocalEmulator.BrowserTests/EasyAuthLocalEmulator.BrowserTests.csproj --configuration Release --no-build --no-restore

      - name: Run WebKit tests
        shell: pwsh
        run: |
          $env:BROWSER = "webkit"
          dotnet test tests/EasyAuthLocalEmulator.BrowserTests/EasyAuthLocalEmulator.BrowserTests.csproj --configuration Release --no-build --no-restore
