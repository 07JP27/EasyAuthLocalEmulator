name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be run from the main branch."
            exit 1
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::Version must be a SemVer value without the v prefix (for example, 1.0.0 or 1.0.0-beta.1)."
            exit 1
          fi

          tag_name="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            echo "::error::Tag $tag_name already exists."
            exit 1
          fi

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag_name already exists."
            exit 1
          fi

          version_without_build="${VERSION%%+*}"
          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-arm64
            archive: zip
          - os: macos-14
            rid: osx-x64
            archive: tar.gz
          - os: macos-14
            rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish src/EasyAuthLocalEmulator/EasyAuthLocalEmulator.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output "artifacts/${{ matrix.rid }}" `
            -p:Version="${{ needs.prepare.outputs.version }}" `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Copy-Item README.md "artifacts/${{ matrix.rid }}/README.md"
          New-Item -ItemType Directory -Force "artifacts/${{ matrix.rid }}/schemas" | Out-Null
          Copy-Item schemas/easyauth-local.schema.json "artifacts/${{ matrix.rid }}/schemas/easyauth-local.schema.json"

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "easyauth-${{ needs.prepare.outputs.tag_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "$archive.sha256"

      - name: Create macOS archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="easyauth-${{ needs.prepare.outputs.tag_name }}-${{ matrix.rid }}.tar.gz"
          tar -C "artifacts/${{ matrix.rid }}" -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyauth-${{ matrix.rid }}
          path: |
            easyauth-${{ needs.prepare.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive }}
            easyauth-${{ needs.prepare.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="${GITHUB_SHA}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          release_args=(
            "$TAG_NAME"
            release/*
            --verify-tag
            --generate-notes
            --title "EasyAuth Local Emulator $TAG_NAME"
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
