name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-arm64
            archive: zip
          - os: macos-14
            rid: osx-x64
            archive: tar.gz
          - os: macos-14
            rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/EasyAuthLocalEmulator/EasyAuthLocalEmulator.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output "artifacts/${{ matrix.rid }}" `
            -p:Version="$version" `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Copy-Item README.md "artifacts/${{ matrix.rid }}/README.md"
          New-Item -ItemType Directory -Force "artifacts/${{ matrix.rid }}/schemas" | Out-Null
          Copy-Item schemas/easyauth-local.schema.json "artifacts/${{ matrix.rid }}/schemas/easyauth-local.schema.json"

      - name: Create Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "easyauth-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -NoNewline "$archive.sha256"

      - name: Create macOS archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="easyauth-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz"
          tar -C "artifacts/${{ matrix.rid }}" -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyauth-${{ matrix.rid }}
          path: |
            easyauth-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}
            easyauth-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
